spring:
  application:
    name: mundial2026-hub

  r2dbc:
    url: r2dbc:mysql://127.0.0.1:3306/mundial2026_db
    username: mundial_user
    password: mundial_pass

  flyway:
    url: jdbc:mysql://127.0.0.1:3306/mundial2026_db
    user: mundial_user
    password: mundial_pass
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: Mundial2026HubClaveSecretaSuperSeguraQueDebeTenerMuchosBitsParaFuncionar
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    max-age: 3600

  ticket:
    ttl-minutes: 15
    max-per-user-per-day: 4

  album:
    stickers-per-pack: 5
    max-trades-per-day: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.mundial2026: DEBUG